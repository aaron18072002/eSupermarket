server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Route definitions
      routes:
        # -------------------------------------------------------------
        # Catalog Service Routes
        # -------------------------------------------------------------
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/brands/**, /api/v1/suppliers/**, /api/v1/tags/**, /api/v1/product-groups/**

        # -------------------------------------------------------------
        # User / Auth Service Routes
        # -------------------------------------------------------------
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        # -------------------------------------------------------------
        # Order / Payment Service Routes
        # -------------------------------------------------------------
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**

        # -------------------------------------------------------------
        # Inventory / Stock Service Routes
        # -------------------------------------------------------------
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventories/**

      # Global CORS configuration for Next.js frontend
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

# Custom Application Properties
application:
  jwt:
    # HMAC secret
    secret: liverpoolvodich123456

# Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.coding.api.gateway: DEBUG
