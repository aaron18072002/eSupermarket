server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Route definitions
      routes:
        # -------------------------------------------------------------
        # Catalog Service Routes
        # -------------------------------------------------------------
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/brands/**, /api/v1/suppliers/**, /api/v1/tags/**, /api/v1/product-groups/**

        # -------------------------------------------------------------
        # User / Auth Service Routes (Reserved for next step)
        # -------------------------------------------------------------
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

      # Global CORS configuration for Next.js frontend
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

# Custom Application Properties
application:
  jwt:
    # HMAC secret (can be overridden via JWT_SECRET environment variable)
    secret: ${JWT_SECRET:liverpoolvodich123456}

# Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.coding.api.gateway: DEBUG
